[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ls-b"
version = "0.1.0"
description = "Brain-guided shared/specific adapter-layer allocation for continual learning with BiLoRA"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Anonymous Authors" }]
requires-python = ">=3.12"
# Core: continual-learning runs with BiLoRA (fixed-rule allocations, tests).
# Exact versions used for the paper are in constraints.txt.
dependencies = [
  "torch",
  "torchvision",
  "timm",
  "numpy",
  "einops",
  "scipy",
  "scikit-learn",
  "PyYAML",
  "tqdm",
  "pillow",
  "matplotlib",
  "ipdb",  # imported at module level by the upstream BiLoRA code
]

[project.optional-dependencies]
# Brain encoder (brainnet) and brain-derived allocations.
brain = [
  "pytorch-lightning",
  "torchmetrics",
  "yacs",
  "nilearn",
  "nibabel",
]
dev = [
  "pytest",
  "ruff",
]

[tool.setuptools]
py-modules = ["exp", "analyze_d2_split", "make_inr_split"]

[tool.setuptools.packages.find]
include = ["core*", "baselines.bilora_adapter*", "model_m*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["baselines/BiLoRA", "brainnet", "third_party"]

[tool.ruff.lint]
# Syntax errors, undefined names and similar hard errors.
select = ["E9", "F63", "F7", "F82"]
